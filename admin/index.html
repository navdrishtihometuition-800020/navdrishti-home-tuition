<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAV DRISHTI | Registration Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font:16px system-ui,Arial}.wrap{max-width:1100px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.panel{background:white;border:1px solid #dce3ee;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 3px 14px #1720330a}h1{font-size:23px;margin:0}input,select,button{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:9px}button{background:#123b70;color:white;border:0;font-weight:700;cursor:pointer}button.secondary{background:#e8eef7;color:#172033}form.login{max-width:420px;margin:12vh auto}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:180px}.muted{color:#64748b}.status{padding:10px 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:11px;border-bottom:1px solid #e2e8f0;vertical-align:top;white-space:normal}th{background:#edf3fa}pre{white-space:pre-wrap;min-width:200px;margin:0;font:13px system-ui}.hidden{display:none}.pill{display:inline-block;background:#e4f1ff;padding:4px 9px;border-radius:30px}.danger{color:#b42318}@media(max-width:600px){.wrap{padding:10px}.panel{padding:12px}h1{font-size:19px}th,td{padding:8px}}
</style></head><body><div class="wrap"><section id="login" class="panel login"><h1>NAV DRISHTI Admin Login</h1><p class="muted">Registration Dashboard access</p><form id="loginForm"><div style="margin:12px 0"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required style="width:100%;margin-top:6px"></div><button type="submit" style="width:100%">Login</button><div id="loginMsg" class="status" role="status"></div></form><p class="muted">Admin password Cloudflare secret <code>ADMIN_PASSWORD</code> se set karein.</p></section><section id="app" class="hidden"><header class="head"><div><h1>NAV DRISHTI Registration Dashboard</h1><p class="muted">Student aur Tutor applications</p></div><button id="logout" class="secondary">Logout</button></header><div class="panel"><div class="row"><input id="search" placeholder="Name, mobile, area se search karein"><select id="type"><option value="all">All registrations</option><option value="student">Students</option><option value="tutor">Tutors</option></select><button id="refresh">Refresh</button></div><div id="status" class="status muted">Loading…</div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>Name / Mobile</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></div><script>
const $=id=>document.getElementById(id);let records=[];
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');load() }
async function check(){try{await api('/api/admin/registrations');showApp()}catch(e){$('login').classList.remove('hidden');$('app').classList.add('hidden')}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').textContent='Checking…';try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});$('password').value='';showApp()}catch(err){$('loginMsg').textContent=err.message}});
$('logout').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST'})}finally{$('app').classList.add('hidden');$('login').classList.remove('hidden')}};
$('refresh').onclick=load;$('type').onchange=render;$('search').oninput=render;
async function load(){ $('status').textContent='Loading registrations…';try{const d=await api('/api/admin/registrations');records=d.registrations||[];render()}catch(e){$('status').textContent=e.message}}
function render(){const q=$('search').value.toLowerCase(),t=$('type').value;const list=records.filter(r=>(t==='all'||r.type===t)&&JSON.stringify(r).toLowerCase().includes(q));$('rows').innerHTML='';for(const r of list){const tr=document.createElement('tr');const name=r.data.student_name||r.data.tutor_name||'—';const mobile=r.data.mobile_number||'—';const details=Object.entries(r.data).filter(([k])=>!['student_name','tutor_name','mobile_number','rating_screenshot'].includes(k)).map(([k,v])=>k.replaceAll('_',' ')+': '+(v||'—')).join('\n');const values=[new Date(r.created_at).toLocaleString(),r.type,name+'\n'+mobile,details];for(let i=0;i<values.length;i++){const td=document.createElement('td');if(i===1){const pill=document.createElement('span');pill.className='pill';pill.textContent=values[i];td.append(pill)}else{const pre=document.createElement('pre');pre.textContent=values[i];td.append(pre)}tr.append(td)}if(r.has_screenshot){const td=tr.lastElementChild;const label=document.createElement('div');label.textContent='Google Maps rating screenshot';label.style.cssText='font-weight:700;margin-top:10px';const img=document.createElement('img');img.src='/api/admin/screenshot?id='+encodeURIComponent(r.id);img.alt='Registration screenshot';img.loading='lazy';img.style.cssText='display:block;width:100%;max-width:240px;height:auto;margin-top:7px;border:1px solid #dce3ee;border-radius:8px';img.onerror=()=>{img.style.display='none'};const link=document.createElement('a');link.href=img.src;link.target='_blank';link.rel='noopener';link.textContent='Open full image';link.style.cssText='display:inline-block;margin-top:6px;color:#123b70;font-weight:700';td.append(label,img,link)}$('rows').append(tr)}$('status').textContent=`${list.length} registrations shown · ${records.length} total loaded`}

check();
</script></body></html>
