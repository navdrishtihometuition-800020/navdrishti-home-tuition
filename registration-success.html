<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration Successful | NAV DRISHTI</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#071b43;display:grid;place-items:center;min-height:100vh;padding:20px}.box{max-width:560px;background:#fff;border-radius:24px;padding:45px 30px;text-align:center;box-shadow:0 20px 60px #071b4320;border:1px solid #dbe5f2}.icon{font-size:55px}.btn{display:inline-block;margin-top:18px;padding:13px 22px;border-radius:12px;background:#ffc928;color:#071b43;font-weight:900;text-decoration:none}.regno{display:none;margin:22px auto 8px;padding:14px;border:2px dashed #1456c0;border-radius:14px;max-width:340px;background:#f4f8ff}.regno strong{display:block;font-size:28px;letter-spacing:2px;margin-top:6px}
</style></head>
<body><div class="box"><div class="icon">✅</div><h1>Registration Successful!</h1><p>Thank you for registering with NAV DRISHTI HOME TUITION. Your registration has been completed successfully.</p><div class="regno" id="regBox">Your registration number is:<strong id="regNumber"></strong><small>Please save this number for future reference.</small></div><a class="btn" href="/">Back to Home</a><script>const n=new URLSearchParams(location.search).get("registration");if(n&&/^\d{9}$/.test(n)){document.getElementById("regNumber").textContent=n;document.getElementById("regBox").style.display="block"}</script></div></body></html>
